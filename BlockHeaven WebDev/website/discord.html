<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockHeaven | Discord</title>
    <link rel="icon" type="image/png" href="/BlockHeaven WebDev/assets/images/short.png">
    <link rel="stylesheet" href="/BlockHeaven WebDev/website/style.css">
</head>
<body>

    <!-- Sidebar -->

    <div class="sidebar">
        

      <div class="sidebar-top">

    <button class="toggle-btn"
            onclick="toggleSidebar()">

        <span class="menu-icon">☰</span>

    </button>

    

</div>

        <a href="/BlockHeaven WebDev/website/home.html"
           class="sidebar-logo">

            <img src="/BlockHeaven WebDev/assets/images/favicon.png"
                 class="logo">

        </a>

        <div class="sidebar-links">

            <a href="/BlockHeaven WebDev/website/join.html">
                <span class="icon">🎮</span>
                <span class="text">Join Us</span>
            </a>

            <a href="/BlockHeaven WebDev/website/discord.html" >
                <span class="icon">💬</span>
                <span class="text">Discord</span>
            </a>

            <a href="/BlockHeaven WebDev/website/rules.html">
                <span class="icon">📜</span>
                <span class="text">Rules</span>
            </a>

            <a href="/BlockHeaven WebDev/website/shop.html">
                <span class="icon">🛒</span>
                <span class="text">Shop</span>
            </a>

            <a href="/BlockHeaven WebDev/website/modpack.html">
                <span class="icon">📦</span>
                <span class="text">Modpack</span>
            </a>

            <a href="/BlockHeaven WebDev/website/support.html">
                <span class="icon">🛠</span>
                <span class="text">Support</span>
            </a>

        </div>

    </div>

    <!-- Main Container -->

    <div class="discord-page">

        <h1 class="discord-title">
            💬 BlockHeaven Discord
        </h1>

        <h2 class="discord-subtitle">
            Join The Community & Stay Updated
        </h2>

        <!-- Main Widget -->

        <iframe
    src="https://discord.com/widget?id=1511259635208687646&theme=dark"

    class="discord-widget"

    allowtransparency="true"

    frameborder="0"

    sandbox="
        allow-popups
        allow-popups-to-escape-sandbox
        allow-same-origin
        allow-scripts">

</iframe>

        <!-- Buttons -->

        <div class="discord-buttons">

            <a href="https://discord.gg/BFHZuVnhrr"
               target="_blank"
               class="discord-btn join-btn">

                🚀 Join Server

            </a>

            <a href="https://discord.com/channels/1511259635208687646"
               target="_blank"
               class="discord-btn">

                💬 Open Discord

            </a>

        </div>

        <!-- Server Stats -->

        <div class="discord-stats">

            <div class="stat-card">

                <h3>👥 Members</h3>

                <p id="memberCount">Loading...</p>

            </div>

            <div class="stat-card">

                <h3>🟢 Online</h3>

                <p id="onlineCount">Loading...</p>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
